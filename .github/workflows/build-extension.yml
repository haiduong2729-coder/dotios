name: dot for safari
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Convert Chrome Extension
        run: |
          mkdir -p output
          xcrun safari-web-extension-converter extension_src \
            --ios-only \
            --project-location output \
            --app-name "DotBPExtension" \
            --bundle-identifier "com.qhuy.dotbpforsafari" \
            --no-open \
            --no-prompt
      - name: Build unsigned IPA
        run: |
          cd output/DotBPExtension
          
          # Tìm file .xcodeproj bất kỳ có trong thư mục hiện tại để build
          PROJECT_FILE=$(ls *.xcodeproj | head -n 1)
          echo "Found project: $PROJECT_FILE"

          # Tiến hành build tự động target iOS đầu tiên tìm thấy
          xcodebuild clean build \
            -project "$PROJECT_FILE" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
            
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" | head -n 1)
          fi
          
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r dotbp.ipa Payload
          mv dotbp.ipa $GITHUB_WORKSPACE/
      - uses: actions/upload-artifact@v4
        with:
          name: dot-extension
          path: dotbp.ipa
